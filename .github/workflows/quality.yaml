name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Check for duplicate dependencies
        run: pnpm dedupe --check

      - name: Check bundle size
        run: |
          pnpm run build
          pnpm run perf:analyze

      - name: Check package.json formatting
        run: npx sort-package-json package.json --check

      - name: Generate complexity report
        run: npx es6-plato -r -d complexity-report app/
        continue-on-error: true

      - name: Upload complexity report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: complexity-report
          path: complexity-report/
          retention-days: 7

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Install Chrome and matching ChromeDriver
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-chromedriver: true

      - name: Start development server
        run: |
          pnpm run dockerstart > "$RUNNER_TEMP/accessibility-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/accessibility-server.log"
          exit 1

      - name: Run accessibility tests with axe
        run: npx @axe-core/cli http://localhost:5173 --exit --chrome-path "${{ steps.setup-chrome.outputs.chrome-path }}" --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}"

  performance-audit:
    name: Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Start server for Lighthouse
        run: |
          pnpm run dockerstart > "$RUNNER_TEMP/lighthouse-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/lighthouse-server.log"
          exit 1

      - name: Run Lighthouse audit
        run: npx lighthouse http://localhost:5173 --output-path=./lighthouse-report.html --output=html --chrome-flags="--headless --no-sandbox"

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.html
          retention-days: 7

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate PR size
        id: pr-size
        run: |
          # Get the base branch (target branch)
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"

          # Count additions and deletions
          ADDITIONS=$(git diff --numstat origin/$BASE_BRANCH...HEAD | awk '{sum += $1} END {print sum}')
          DELETIONS=$(git diff --numstat origin/$BASE_BRANCH...HEAD | awk '{sum += $2} END {print sum}')
          TOTAL_CHANGES=$((ADDITIONS + DELETIONS))

          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL_CHANGES" >> $GITHUB_OUTPUT

          # Determine size category
          if [ $TOTAL_CHANGES -lt 50 ]; then
            echo "size=XS" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 200 ]; then
            echo "size=S" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 500 ]; then
            echo "size=M" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 1000 ]; then
            echo "size=L" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -lt 2000 ]; then
            echo "size=XL" >> $GITHUB_OUTPUT
          else
            echo "size=XXL" >> $GITHUB_OUTPUT
          fi

      - name: PR size summary
        run: |
          echo "✅ PR Size Analysis Complete"
          echo "📊 Changes: +${{ steps.pr-size.outputs.additions }} -${{ steps.pr-size.outputs.deletions }}"
          echo "📏 Size Category: ${{ steps.pr-size.outputs.size }}"
          echo "💡 This information helps reviewers understand the scope of changes"

          if [ "${{ steps.pr-size.outputs.size }}" = "XXL" ]; then
            echo "ℹ️ This is a large PR - consider breaking it into smaller chunks for future PRs"
            echo "However, large PRs are acceptable for major feature additions like this one"
          fi
