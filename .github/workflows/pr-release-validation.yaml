name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for and validate required status checks
        uses: actions/github-script@v9
        with:
          script: |
            const requiredCodeQlChecks = 1;
            const deadline = Date.now() + 30 * 60 * 1000;
            const ref = context.payload.pull_request.head.sha;

            while (Date.now() < deadline) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                per_page: 100,
              });

              const testChecks = checkRuns.filter(check => check.name === 'Test');
              const codeQlChecks = checkRuns.filter(check => check.name.startsWith('CodeQL Analysis'));
              const requiredChecks = [...testChecks, ...codeQlChecks];

              if (testChecks.length > 0 && codeQlChecks.length >= requiredCodeQlChecks) {
                const pendingChecks = requiredChecks.filter(check => check.status !== 'completed');
                if (pendingChecks.length > 0) {
                  core.info(`Waiting for required checks: ${pendingChecks.map(check => check.name).join(', ')}`);
                } else {
                  const failedChecks = requiredChecks.filter(check => check.conclusion !== 'success');
                  if (failedChecks.length > 0) {
                    core.setFailed(`Required checks failed: ${failedChecks.map(check => `${check.name} (${check.conclusion})`).join(', ')}`);
                    return;
                  }

                  core.info(`Required checks passed: ${requiredChecks.map(check => check.name).join(', ')}`);
                  return;
                }
              } else {
                core.info('Waiting for Test and CodeQL Analysis checks to start.');
              }

              await new Promise(resolve => setTimeout(resolve, 10_000));
            }

            core.setFailed('Timed out after 30 minutes waiting for required Test and CodeQL Analysis checks.');

  validate-release:
    name: Release Validation
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PR Labels
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'stable-release') }}" == "true" ]]; then
            echo "✓ PR has stable-release label"
            
            # Check version bump labels
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'major') }}" == "true" ]]; then
              echo "✓ Major version bump requested"
            elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'minor') }}" == "true" ]]; then
              echo "✓ Minor version bump requested"
            else
              echo "✓ Patch version bump will be applied"
            fi
          else
            echo "This PR doesn't have the stable-release label. No release will be created." 
          fi

      - name: Check breaking changes
        if: contains(github.event.pull_request.labels.*.name, 'major')
        run: |
          echo "⚠️ This PR contains breaking changes and will trigger a major release."
          
      - name: Validate changelog entry
        if: contains(github.event.pull_request.labels.*.name, 'stable-release')
        run: |
          if ! grep -q "${{ github.event.pull_request.number }}" CHANGES.md; then
            echo "❌ No changelog entry found for PR #${{ github.event.pull_request.number }}"
            echo "Please add an entry to CHANGES.md"
            exit 1
          else
            echo "✓ Changelog entry found"
          fi

  security-review:
    name: Security Review Required
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'security')
    
    steps:
      - name: Check security label
        run: |
          echo "🔒 This PR has security implications and requires additional review"
          echo "Ensure a security team member has approved this PR before merging"
